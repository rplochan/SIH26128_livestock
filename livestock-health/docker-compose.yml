services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: livestock, POSTGRES_PASSWORD: livestock, POSTGRES_DB: livestock }
    ports: ["5432:5432"]
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://livestock:livestock@db:5432/livestock
      JWT_SECRET: dev-secret
    ports: ["8000:8000"]
    depends_on: [db]
